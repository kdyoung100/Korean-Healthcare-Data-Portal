name: Build & Deploy to GitHub Pages

# 엑셀 2개(자료입력양식 / 중개포털 데이터 리스트) 중 하나만 바뀌어도
# 여기서 build.py 를 돌려 data.json 을 다시 만들고 배포한다.
# index.html 은 빌드하지 않고 그대로 올린다(챗봇 이미지 chatbot-icon.png 도 같이). data.json 을 읽어서 목록·검색·기관 필터·
# 상세 본문·상단 통계까지 전부 스스로 채우기 때문이다.
on:
  push:
    branches: [main]
    paths:
      - "자료입력양식*.xlsx"                # 원본 ① 상세 내용
      - "중개포털_데이터_리스트*.xlsx"      # 원본 ② 검색 목록
      - "자료집ID.json"                    # 발급한 번호 기록
      - "build.py"
      - "index.html"
      - "chatbot-icon.png"
      - ".github/workflows/deploy.yml"
  # Actions 탭 → 이 워크플로 → [Run workflow] 버튼 하나로도 다시 돌아간다.
  workflow_dispatch:

permissions:
  contents: write      # 자료집ID.json 자동 커밋에 필요 (원래는 read 였다)
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      # 엑셀 2개 -> data.json. hwpx 도, 중간 md 파일도 없다.
      - name: 빌드 (엑셀 2개 → data.json)
        run: |
          set -o pipefail
          python build.py 2>&1 | tee build.log

      # 로그를 Actions 실행 화면 맨 위에 그대로 붙여 준다.
      # 몇 건이 붙었고 새 번호가 뭔지, 로그를 펼치지 않고 바로 보인다.
      - name: 결과 요약
        if: always()
        run: |
          {
            echo "### 빌드 결과"
            echo '```'
            cat build.log 2>/dev/null || echo "(빌드가 시작되기 전에 멈췄습니다)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # build.py 가 새 번호를 발급했으면 그 기록을 리포에 되돌려 놓는다.
      # 이게 없으면 다음 빌드에서 번호가 다시 매겨진다.
      # GITHUB_TOKEN 으로 push 하면 워크플로가 재실행되지 않아 무한 루프가 없다.
      - name: 자료집ID.json 자동 커밋
        run: |
          if git diff --quiet -- 자료집ID.json; then
            echo "자료집ID.json 변동 없음"
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add 자료집ID.json
            git commit -m "자료집ID.json 자동 갱신 [skip ci]"
            git push
          fi

      - name: 배포용 폴더(_site) 구성
        run: |
          mkdir -p _site
          cp index.html _site/
          cp data.json  _site/
          cp chatbot-icon.png _site/

      - name: Pages 아티팩트 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
